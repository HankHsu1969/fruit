<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>水果盤 FRUIT MACHINE</title>
  <link rel="icon" href="img/cherry.png">
  <link rel="preload" as="image" href="img/cover.jpg">
  <style>
    /* 載入封面：寫在這裡讓它第一時間就畫出來 */
    #loader {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: flex-end; justify-content: center;
      background: #07020a url("img/cover.jpg") center / cover no-repeat;
      transition: opacity .6s;
    }
    #loader.done { opacity: 0; pointer-events: none; }
    .ld-box { width: min(560px, 86vw); margin-bottom: 5vh; text-align: center; font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; }
    .ld-text { margin: 0 0 12px; color: #ffe79a; font-size: clamp(18px, 3vw, 30px); font-weight: 900; letter-spacing: .08em; text-shadow: 0 0 10px #ff7a00, 0 2px 0 #000; }
    .ld-dots { display: inline-block; width: 1.6em; text-align: left; }
    .ld-dots::after { content: ""; animation: ld-dots 1.2s steps(1) infinite; }
    @keyframes ld-dots { 0% { content: ""; } 25% { content: "．"; } 50% { content: "．．"; } 75% { content: "．．．"; } }
    .ld-bar { height: 14px; border-radius: 8px; overflow: hidden; background: rgba(0, 0, 0, .65); border: 2px solid #f5c542; box-shadow: 0 0 12px rgba(255, 180, 0, .5); }
    .ld-bar i { display: block; width: 0; height: 100%; background: linear-gradient(90deg, #ffb000, #fff3a0); transition: width .25s; }
    .ld-pct { margin: 6px 0 0; color: #f3e3c0; font: 700 14px ui-monospace, Consolas, monospace; text-shadow: 0 1px 2px #000; }
    body.loading #stage { visibility: hidden; }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body class="loading">
  <div id="loader" role="status" aria-live="polite">
    <div class="ld-box">
      <p class="ld-text">遊戲載入中，請稍後<span class="ld-dots"></span></p>
      <div class="ld-bar"><i id="ldFill"></i></div>
      <p class="ld-pct" id="ldPct">0%</p>
    </div>
  </div>
  <script>
    // 封面一出來就先預載遊戲圖片；音效由 sound.js 解碼。game.js 開機時等兩者都好了才收起封面（圖片佔 60%、音效佔 40%）
    (function () {
      var urls = ['img/logo.png', 'img/bg.jpg'].concat(['seven', 'bar3', 'bar2', 'bar1', 'star', 'melon', 'bell', 'orange', 'cherry', 'wild'].map(function (s) { return 'img/' + s + '.png'; }));
      var imgDone = 0, sndDone = 0, sndTotal = 1;
      var fill = document.getElementById('ldFill'), pct = document.getElementById('ldPct');
      function paint() {
        var p = Math.round(100 * (0.6 * imgDone / urls.length + 0.4 * sndDone / sndTotal));
        fill.style.width = p + '%';
        pct.textContent = p + '%';
      }
      window.FruitLoader = {
        images: new Promise(function (resolve) {
          urls.forEach(function (u) {
            var im = new Image();
            im.onload = im.onerror = function () { imgDone++; paint(); if (imgDone === urls.length) resolve(); };
            im.src = u;
          });
        }),
        sounds: function (n, total) { sndDone = n; sndTotal = total || 1; paint(); },
        finish: function () {
          var el = document.getElementById('loader');
          document.body.classList.remove('loading');
          el.classList.add('done');
          setTimeout(function () { el.remove(); }, 700);
        },
      };
    })();
  </script>
  <div id="stage">
    <aside class="side left">
      <img class="logo" src="img/logo.png" alt="水果盤 FRUIT MACHINE">
      <section class="panel">
        <h2>賠率表 <small>倍數 × 每線押注</small></h2>
        <table class="paytable" id="paytable"></table>
        <div class="sevens" id="sevensTable"></div>
      </section>
      <section class="panel stats">
        <h2>本機紀錄</h2>
        <dl>
          <dt>局數</dt><dd id="statGames">0</dd>
          <dt>累計投幣</dt><dd id="statCoins">0</dd>
          <dt>單局最高</dt><dd id="statBest">0</dd>
        </dl>
      </section>
    </aside>

    <main class="machine">
      <img class="logo logo-top" src="img/logo.png" alt="">

      <div class="reel-box" id="reelBox">
        <div class="window" id="window">
          <div class="reel" data-reel="0"></div>
          <div class="reel" data-reel="1"></div>
          <div class="reel" data-reel="2"></div>
          <div class="hl-grid" id="hlGrid"></div>
          <svg class="paylines" id="paylines" aria-hidden="true"></svg>
          <div class="win-tag" id="winTag"></div>
        </div>
      </div>

      <div class="msg-row">
        <div class="dotmatrix"><span id="msg">歡迎光臨</span></div>
        <div class="dbl-box">
          <label>比倍<em id="dblHint">小1–6 大8–13</em></label>
          <div class="seg7 green" id="ledDouble"></div>
        </div>
      </div>

      <div class="led-row">
        <button class="music" id="btnMute" title="音效開關（M）">音效</button>
        <div class="led"><label>贏得<br>金額</label><div class="seg7" id="ledWin"></div></div>
        <div class="led"><label>總<br>押注</label><div class="seg7 amber" id="ledBet"></div></div>
        <div class="led"><label>目前<br>餘額</label><div class="seg7" id="ledCredit"></div></div>
      </div>

      <div class="buttons">
        <button class="rb green" id="btnBig"><span class="cap"><i></i></span><b>比倍/大<kbd>B</kbd></b></button>
        <button class="rb green" id="btnSmall"><span class="cap"><i></i></span><b>小<kbd>S</kbd></b></button>
        <button class="rb blue" id="btnStop0"><span class="cap"><i></i></span><b>停1<kbd>1</kbd></b></button>
        <button class="rb blue" id="btnStop1"><span class="cap"><i></i></span><b>停2<kbd>2</kbd></b></button>
        <button class="rb blue" id="btnStop2"><span class="cap"><i></i></span><b>停3<kbd>3</kbd></b></button>
        <button class="rb yellow" id="btnTake"><span class="cap"><i></i></span><b>得分<kbd>T</kbd></b></button>
        <button class="rb green" id="btnCoin"><span class="cap"><i></i></span><b>投幣<kbd>C</kbd></b></button>
        <button class="rb red" id="btnBet"><span class="cap"><i></i></span><b>押注<kbd>Q</kbd></b></button>
        <button class="rb red" id="btnLines"><span class="cap"><i></i></span><b>押線<kbd>W</kbd></b></button>
        <button class="rb red" id="btnMax"><span class="cap"><i></i></span><b>最大注<kbd>E</kbd></b></button>
        <button class="rb yellow" id="btnAuto"><span class="cap"><i></i></span><b>自動<kbd>A</kbd></b></button>
        <button class="rb yellow big" id="btnSpin"><span class="cap"><i></i></span><b>轉/全停<kbd>SPACE</kbd></b></button>
      </div>
    </main>

    <aside class="side right">
      <section class="panel">
        <h2>8 條線 <small>押線依序開放</small></h2>
        <div class="line-thumbs" id="lineThumbs"></div>
      </section>
      <section class="panel">
        <h2>中獎紀錄</h2>
        <ul class="history" id="history"></ul>
      </section>
      <p class="disclaimer">懷舊娛樂模擬・1 分 = 10 元（僅為遊戲顯示，無任何實際價值）</p>
    </aside>
  </div>

  <script src="core.js" defer></script>
  <script src="sfx/sounds.js" defer></script>
  <script src="sound.js" defer></script>
  <script src="game.js" defer></script>
</body>
</html>
